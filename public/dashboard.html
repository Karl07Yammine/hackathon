<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | Lebanon Flow</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f5f7fb; color: #14213d; }
    .nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 7%; background: white; box-shadow: 0 8px 20px rgba(0,0,0,.06); }
    .logo { font-weight: 800; font-size: 22px; }
    .links { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    a, button { text-decoration: none; border: 0; cursor: pointer; border-radius: 12px; padding: 11px 16px; font-weight: 700; color: #14213d; background: #e8eefc; }
    button.primary, a.primary { background: #2563eb; color: white; }
    main { padding: 40px 7%; }
    .header { background: white; padding: 28px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.07); margin-bottom: 28px; }
    .badge { color: #2563eb; background: #e8eefc; display: inline-block; padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 800; margin-bottom: 10px; }
    h1 { margin-bottom: 8px; }
    p { color: #64748b; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .card { background: white; padding: 24px; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.06); }
    .card h3 { margin-bottom: 8px; }
    .icon { font-size: 28px; display: block; margin-bottom: 12px; }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="logo">✦ Lebanon Flow</div>
    <div class="links">
      <a href="/services">Services</a>
      <a href="/support">Support</a>
      <a href="/settings">Settings</a>
      <button id="logoutBtn" class="primary">Logout</button>
    </div>
  </nav>

  <main>
    <section class="header">
      <span class="badge">Main dashboard</span>
      <h1 id="welcomeText">Checking login...</h1>
      <p id="emailText">Please wait.</p>
    </section>

    <section class="grid">
      <a href="/services" class="card">
        <span class="icon">🧭</span>
        <h3>Find Services</h3>
        <p>Browse available support categories.</p>
      </a>
      <a href="/support" class="card">
        <span class="icon">☎️</span>
        <h3>Support Center</h3>
        <p>Call, WhatsApp, email, or chat with support.</p>
      </a>
      <a href="/settings" class="card">
        <span class="icon">⚙️</span>
        <h3>Settings</h3>
        <p>View your local demo profile.</p>
      </a>
    </section>
  </main>

  <script type="module">
    import { Client, Account } from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";

    async function getAppwriteAccount() {
      const configResponse = await fetch("/api/config");
      const config = await configResponse.json();
      const client = new Client().setEndpoint(config.endpoint).setProject(config.projectId);
      return new Account(client);
    }

    const account = await getAppwriteAccount();

    async function protectPage() {
      try {
        const user = await account.get();
        document.getElementById("welcomeText").textContent = `Welcome, ${user.name || "User"}`;
        document.getElementById("emailText").textContent = user.email;
      } catch (error) {
        window.location.href = "/login";
      }
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      try {
        await account.deleteSession("current");
        window.location.href = "/login";
      } catch (error) {
        alert(error.message || "Logout failed");
      }
    });

    protectPage();
  </script>
</body>
</html>
