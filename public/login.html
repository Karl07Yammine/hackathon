<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Lebanon Flow</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      color: #14213d;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 460px;
      background: white;
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-weight: 700;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d6dce8;
      border-radius: 12px;
      font-size: 15px;
    }

    button,
    a {
      display: inline-block;
      width: 100%;
      margin-top: 16px;
      text-align: center;
      text-decoration: none;
      border: 0;
      border-radius: 12px;
      padding: 13px 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button {
      background: #2563eb;
      color: white;
    }

    a {
      background: #e8eefc;
      color: #2563eb;
    }

    .msg {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      display: none;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      background: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Login</h1>
    <p>If you already have an active Appwrite session, this page will send you to the dashboard automatically.</p>

    <form id="loginForm">
      <label>Email</label>
      <input id="emailInput" type="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input id="passwordInput" type="password" placeholder="Your password" required minlength="8" />

      <button type="submit">Login</button>
    </form>

    <a href="/signup">Create new account</a>
    <a href="/">Back home</a>
    <div id="messageBox" class="msg"></div>
  </div>

  <script type="module">
    import { Client, Account } from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";

    const messageBox = document.getElementById("messageBox");
    const loginForm = document.getElementById("loginForm");

    function showMessage(text, type = "loading") {
      messageBox.textContent = text;
      messageBox.className = `msg ${type}`;
      messageBox.style.display = "block";
    }

    async function getAppwriteAccount() {
      const configResponse = await fetch("/api/config");
      const config = await configResponse.json();
      const client = new Client().setEndpoint(config.endpoint).setProject(config.projectId);
      return new Account(client);
    }

    const account = await getAppwriteAccount();

    async function skipLoginIfSessionExists() {
      try {
        await account.get();
        window.location.href = "/dashboard";
      } catch (error) {
        // No session. User can log in.
      }
    }

    await skipLoginIfSessionExists();

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const email = document.getElementById("emailInput").value.trim();
      const password = document.getElementById("passwordInput").value;

      try {
        showMessage("Logging in...");
        await account.createEmailPasswordSession(email, password);
        window.location.href = "/dashboard";
      } catch (error) {
        showMessage(error.message || "Login failed", "error");
      }
    });
  </script>
</body>

</html>
